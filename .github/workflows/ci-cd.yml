name: ApexHunter CI/CD

# Every branch push and pull request is checked. Only main publishes/releases.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an unfinished run for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-demo:
    name: Verify Community Cloud demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: frontend/requirements.txt
      - name: Install the hosted dashboard runtime
        run: python -m pip install -r frontend/requirements.txt ruff==0.17.3
      - name: Validate hosted dependencies and Python
        run: |
          python -m pip check
          python -m ruff check --select E9,F63,F7,F82 backend frontend deployment
      - name: Exercise genuine demo data and dashboard selections
        run: python -m unittest discover -s deployment/tests -v
      - name: Report delivery mode
        run: |
          echo 'Community Cloud follows its configured Git branch independently of Actions. A green CI run does not prove a completed healthy rollout.' >> "$GITHUB_STEP_SUMMARY"

  verify-and-package:
    name: Build, check, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    env:
      LOCAL_IMAGE: apexhunter:ci

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and load the application image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Check Python syntax and fatal errors
        run: >-
          docker run --rm "$LOCAL_IMAGE"
          python -m ruff check --select E9,F63,F7,F82 backend frontend

      - name: Check installed dependency compatibility
        run: docker run --rm "$LOCAL_IMAGE" python -m pip check

      - name: Run the existing unit test suite
        run: |
          docker run --rm \
            --env OMP_NUM_THREADS=1 \
            --env MKL_NUM_THREADS=1 \
            --env OPENBLAS_NUM_THREADS=1 \
            "$LOCAL_IMAGE" python backend/scripts/tests/run_tests.py

      - name: Smoke test Streamlit over HTTP
        run: |
          trap 'docker rm --force apexhunter-smoke >/dev/null 2>&1 || true' EXIT
          docker run --detach --name apexhunter-smoke \
            --publish 127.0.0.1:8501:8501 "$LOCAL_IMAGE"
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 \
              http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "Streamlit is responding on port 8501."
              exit 0
            fi
            sleep 2
          done
          docker logs apexhunter-smoke
          echo "::error::Streamlit did not become healthy."
          exit 1

      # Publishing happens after every check passes, using the SAME local image.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          docker tag "$LOCAL_IMAGE" "$image:$COMMIT_SHA"
          docker tag "$LOCAL_IMAGE" "$image:latest"
          docker push "$image:$COMMIT_SHA"
          docker push "$image:latest"
          echo "Published \`$image:$COMMIT_SHA\` and \`$image:latest\`." >> "$GITHUB_STEP_SUMMARY"
